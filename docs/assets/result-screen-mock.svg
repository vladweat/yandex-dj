<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Prompt DJ — статический макет результата</title>
  <desc id="desc">Вымышленный пример результата подбора плейлиста со списком тестовых треков и действиями.</desc>
  <defs>
