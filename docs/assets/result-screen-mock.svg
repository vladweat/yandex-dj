      <stop offset="0" stop-color="#ffcc00" stop-opacity=".11"/>
      <stop offset="1" stop-color="#080a0f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6ca42"/>
