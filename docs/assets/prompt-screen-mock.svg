<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Prompt DJ — статический макет экрана промпта</title>
  <desc id="desc">Вымышленный пример формы генерации плейлиста в тёмном интерфейсе с жёлтым акцентом.</desc>
  <defs>
    <radialGradient id="glow" cx="50%" cy="0%" r="75%">
      <stop offset="0" stop-color="#ffcc00" stop-opacity=".13"/>
      <stop offset="1" stop-color="#080a0f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171d29"/>
      <stop offset="1" stop-color="#10141d"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="900" fill="#080a0f"/>
  <rect width="1440" height="900" fill="url(#glow)"/>

  <path d="M0 84H1440" stroke="#ffffff" stroke-opacity=".08"/>
  <circle cx="69" cy="42" r="17" fill="#ffcc00"/>
  <path d="M59 43h4l3-7 5 14 4-9h5" fill="none" stroke="#111318" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="100" y="49" fill="#f2f4f8" font-family="system-ui,sans-serif" font-size="18" font-weight="750" letter-spacing=".4">PROMPT <tspan fill="#ffcc00">DJ</tspan></text>
  <text x="1110" y="49" fill="#b6bece" font-family="system-ui,sans-serif" font-size="14">Генерация</text>
  <text x="1212" y="49" fill="#838da1" font-family="system-ui,sans-serif" font-size="14">Галерея</text>
  <rect x="1301" y="24" width="86" height="36" rx="12" fill="#ffcc00"/>
  <text x="1344" y="47" text-anchor="middle" fill="#111318" font-family="system-ui,sans-serif" font-size="13" font-weight="700">Войти</text>

  <g font-family="system-ui,sans-serif">
    <text x="164" y="216" fill="#f2f4f8" font-size="44" font-weight="760" letter-spacing="-1.6">Prompt <tspan fill="#ffcc00">DJ</tspan></text>
    <text x="164" y="255" fill="#a0a9bb" font-size="17">Опишите настроение — плейлист сразу окажется в Яндекс Музыке</text>

    <rect x="150" y="296" width="820" height="413" rx="24" fill="url(#card)" stroke="#ffffff" stroke-opacity=".09"/>
    <text x="184" y="344" fill="#e6e9ef" font-size="14" font-weight="650">Опишите плейлист</text>
    <rect x="180" y="366" width="760" height="132" rx="15" fill="#0c1018" stroke="#ffffff" stroke-opacity=".10"/>
    <text x="204" y="407" fill="#e2e6ee" font-size="16">Синтвейв для ночной поездки под дождём,</text>
    <text x="204" y="434" fill="#e2e6ee" font-size="16">мягкий ритм и немного ностальгии</text>
    <text x="204" y="472" fill="#657087" font-size="12">Пример запроса • вымышленные данные</text>

    <text x="184" y="541" fill="#8d97aa" font-size="12" font-weight="650" letter-spacing=".8">ПОПРОБУЙТЕ СИТУАЦИЮ</text>
    <rect x="180" y="557" width="142" height="39" rx="20" fill="#ffcc00" fill-opacity=".12" stroke="#ffcc00" stroke-opacity=".24"/>
    <text x="251" y="582" text-anchor="middle" fill="#ffdc4d" font-size="13" font-weight="600">Ночной драйв</text>
    <rect x="333" y="557" width="119" height="39" rx="20" fill="#ffffff" fill-opacity=".035" stroke="#ffffff" stroke-opacity=".09"/>
    <text x="392" y="582" text-anchor="middle" fill="#c5ccda" font-size="13">Фокус</text>
    <rect x="463" y="557" width="145" height="39" rx="20" fill="#ffffff" fill-opacity=".035" stroke="#ffffff" stroke-opacity=".09"/>
    <text x="535" y="582" text-anchor="middle" fill="#c5ccda" font-size="13">Тихий вечер</text>

    <text x="184" y="642" fill="#8d97aa" font-size="13">Количество треков</text>
    <rect x="184" y="657" width="83" height="34" rx="10" fill="#0c1018" stroke="#ffffff" stroke-opacity=".10"/>
    <text x="225" y="680" text-anchor="middle" fill="#e2e6ee" font-size="14">25</text>
    <rect x="731" y="638" width="209" height="49" rx="15" fill="#ffcc00"/>
    <text x="835" y="668" text-anchor="middle" fill="#111318" font-size="14" font-weight="750">Собрать плейлист</text>

    <rect x="1000" y="296" width="290" height="413" rx="24" fill="#0e121b" stroke="#ffffff" stroke-opacity=".07"/>
    <text x="1030" y="340" fill="#e2e6ee" font-size="14" font-weight="650">Ваша история</text>
    <text x="1030" y="365" fill="#6e788b" font-size="12">Примеры, не сохранённые сессии</text>
    <rect x="1023" y="390" width="244" height="74" rx="14" fill="#171d29"/>
    <circle cx="1052" cy="427" r="15" fill="#473b1b"/>
    <path d="M1048 421v12l10-6z" fill="#ffcc00"/>
    <text x="1080" y="423" fill="#e2e6ee" font-size="12" font-weight="600">Синтвейв для поездки</text>
    <text x="1080" y="444" fill="#778197" font-size="11">25 треков • mock</text>
    <rect x="1023" y="476" width="244" height="74" rx="14" fill="#121721"/>
    <circle cx="1052" cy="513" r="15" fill="#292b44"/>
    <path d="M1048 507v12l10-6z" fill="#a9a5ff"/>
    <text x="1080" y="509" fill="#c6ccda" font-size="12" font-weight="600">Музыка для фокуса</text>
    <text x="1080" y="530" fill="#778197" font-size="11">18 треков • mock</text>
    <rect x="1023" y="562" width="244" height="74" rx="14" fill="#121721"/>
    <circle cx="1052" cy="599" r="15" fill="#1c3a3a"/>
    <path d="M1048 593v12l10-6z" fill="#71d3c8"/>
    <text x="1080" y="595" fill="#c6ccda" font-size="12" font-weight="600">Тихий вечер</text>
    <text x="1080" y="616" fill="#778197" font-size="11">12 треков • mock</text>

    <rect x="150" y="765" width="1140" height="1" fill="#ffffff" fill-opacity=".08"/>
    <text x="150" y="800" fill="#6d778b" font-size="11" font-weight="650" letter-spacing="1">СТАТИЧЕСКИЙ МАКЕТ · ВЫМЫШЛЕННЫЕ ДАННЫЕ · НЕ СКРИНШОТ РАБОТАЮЩЕГО СЕРВИСА</text>
  </g>
</svg>
